<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">NotesHub mark</title>
  <desc id="desc">A layered notes page symbol with a folded corner and writing lines.</desc>
